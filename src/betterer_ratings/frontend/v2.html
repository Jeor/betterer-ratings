<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian — PMDB Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090b;
  --card:#111113;
  --card-hover:#151517;
  --border:#1e1e21;
  --border-subtle:#161618;
  --text:#fafafa;
  --text-secondary:#71717a;
  --text-muted:#3f3f46;
  --emerald:#10b981;
  --emerald-dim:rgba(16,185,129,.12);
  --blue:#3b82f6;
  --blue-dim:rgba(59,130,246,.12);
  --violet:#8b5cf6;
  --violet-dim:rgba(139,92,246,.12);
  --amber:#f59e0b;
  --amber-dim:rgba(245,158,11,.12);
  --red:#ef4444;
  --red-dim:rgba(239,68,68,.12);
  --font-body:'Plus Jakarta Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --radius:8px;
  --radius-sm:5px;
  --radius-pill:100px;
}
html{font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.02) 1px, transparent 0);
  background-size:24px 24px;
}
a{color:inherit;text-decoration:none}

/* ─── TOP NAV ─── */
.topnav{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 24px;
  border-bottom:1px solid var(--border);
  background:rgba(9,9,11,.85);
  backdrop-filter:blur(12px);
  position:sticky;top:0;z-index:100;
}
.topnav-brand{display:flex;align-items:center;gap:10px}
.topnav-brand svg{width:20px;height:20px;color:var(--emerald)}
.topnav-brand span{font-weight:700;font-size:1rem;letter-spacing:-.02em}
.topnav-brand small{color:var(--text-secondary);font-weight:400;font-size:.75rem;margin-left:2px}
.topnav-links{display:flex;gap:2px;background:rgba(255,255,255,.04);border-radius:var(--radius-sm);padding:2px}
.topnav-links a{
  padding:5px 14px;border-radius:4px;font-size:.75rem;font-weight:600;
  color:var(--text-secondary);transition:all .15s;
}
.topnav-links a:hover{color:var(--text)}
.topnav-links a.active{background:var(--emerald);color:#000}
.topnav-right{display:flex;align-items:center;gap:16px}
.topnav-status{display:flex;align-items:center;gap:6px;font-size:.7rem;color:var(--text-secondary)}
.topnav-status .dot{width:6px;height:6px;border-radius:50%;background:var(--emerald);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.4}}

/* ─── TAB BAR ─── */
.tab-bar{
  display:flex;gap:0;padding:0 24px;
  border-bottom:1px solid var(--border);
  background:rgba(17,17,19,.6);
}
.tab-btn{
  padding:12px 20px;font-size:.8rem;font-weight:600;
  color:var(--text-secondary);cursor:pointer;
  border:none;background:none;position:relative;
  transition:color .15s;letter-spacing:.02em;
  text-transform:uppercase;
}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--emerald)}
.tab-btn.active::after{
  content:'';position:absolute;bottom:-1px;left:12px;right:12px;
  height:2px;background:var(--emerald);border-radius:2px 2px 0 0;
}

/* ─── MAIN ─── */
.main{padding:20px 24px 40px;max-width:1440px;margin:0 auto}

/* ─── TAB PANELS ─── */
.tab-panel{display:none;animation:tabIn .25s ease}
.tab-panel.active{display:block}
@keyframes tabIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* ─── STAT CARDS ─── */
.stats-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:20px}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.stats-grid{grid-template-columns:repeat(2,1fr)}}

.stat-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 18px;position:relative;overflow:hidden;
  transition:border-color .2s;
}
.stat-card:hover{border-color:#2a2a2e}
.stat-card .stat-label{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text-secondary);margin-bottom:8px}
.stat-card .stat-value{font-family:var(--font-mono);font-size:1.6rem;font-weight:700;line-height:1;margin-bottom:4px}
.stat-card .stat-sub{font-size:.7rem;color:var(--text-muted)}
.stat-card .sparkline{position:absolute;bottom:0;right:0;opacity:.5}
.stat-card.pending .stat-value{color:var(--amber)}
.stat-card.failed .stat-value{color:var(--red)}

/* ─── PANELS / CARDS ─── */
.panel{
  background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:16px;overflow:hidden;
}
.panel-header{
  padding:14px 18px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.panel-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.panel-badge{font-family:var(--font-mono);font-size:.7rem;color:var(--text-secondary)}
.panel-body{padding:16px 18px}

/* ─── TWO COL ─── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* ─── THREE COL ─── */
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media(max-width:900px){.three-col{grid-template-columns:1fr}}

/* ─── TABLES ─── */
.data-table{width:100%;border-collapse:collapse}
.data-table th{
  font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--text-secondary);text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--border);
}
.data-table th.r{text-align:right}
.data-table td{
  padding:8px 10px;border-bottom:1px solid var(--border-subtle);
  font-size:.8rem;vertical-align:middle;
}
.data-table td.mono{font-family:var(--font-mono);text-align:right;font-weight:500}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:rgba(255,255,255,.02)}

/* ─── STATUS PILLS ─── */
.pill{
  display:inline-flex;align-items:center;
  padding:2px 8px;border-radius:var(--radius-pill);
  font-size:.65rem;font-weight:600;font-family:var(--font-mono);
  white-space:nowrap;
}
.pill-submitted{background:var(--emerald-dim);color:var(--emerald)}
.pill-pending{background:var(--amber-dim);color:var(--amber)}
.pill-failed{background:var(--red-dim);color:var(--red)}
.pill-inflight,.pill-in_flight{background:var(--blue-dim);color:var(--blue)}
.pill-movie{background:var(--blue-dim);color:var(--blue)}
.pill-tv{background:var(--violet-dim);color:var(--violet)}
.pill-active{background:var(--emerald-dim);color:var(--emerald)}
.pill-paused{background:var(--red-dim);color:var(--red)}

/* ─── PROGRESS BAR ─── */
.stacked-bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.04);margin:12px 0 8px}
.stacked-bar span{height:100%;transition:width .4s ease}
.stacked-bar .seg-submitted{background:var(--emerald)}
.stacked-bar .seg-pending{background:var(--amber)}
.stacked-bar .seg-failed{background:var(--red)}
.stacked-bar .seg-inflight{background:var(--blue)}

/* ─── RATE LIMIT BAR ─── */
.rate-bar-track{height:4px;border-radius:2px;background:rgba(255,255,255,.06);margin:6px 0}
.rate-bar-fill{height:100%;border-radius:2px;background:var(--emerald);transition:width .4s}

/* ─── HORIZONTAL BAR CHART ─── */
.hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.hbar-label{font-size:.75rem;width:60px;color:var(--text-secondary);text-transform:uppercase;font-weight:600}
.hbar-track{flex:1;height:20px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden}
.hbar-fill{height:100%;border-radius:4px;transition:width .5s ease;display:flex;align-items:center;padding-left:8px;font-family:var(--font-mono);font-size:.65rem;font-weight:600;color:#000;min-width:fit-content}
.hbar-count{font-family:var(--font-mono);font-size:.75rem;width:50px;text-align:right;font-weight:500}

/* ─── PROVIDER CARD ─── */
.provider-card{padding:16px 18px}
.provider-card .provider-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.provider-card .provider-name{font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:8px}
.provider-card .provider-name .dot{width:8px;height:8px;border-radius:50%}
.provider-card .provider-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.provider-card .meta-item label{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-secondary);font-weight:600;margin-bottom:2px}
.provider-card .meta-item span{font-family:var(--font-mono);font-size:.8rem;font-weight:500}

/* ─── RATING DOTS ─── */
.rating-dots{display:flex;gap:3px;flex-wrap:wrap}
.rating-dot{
  width:20px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-size:.5rem;font-weight:700;font-family:var(--font-mono);
}
.rating-dot.submitted{background:var(--emerald-dim);color:var(--emerald)}
.rating-dot.pending{background:var(--amber-dim);color:var(--amber)}
.rating-dot.failed{background:var(--red-dim);color:var(--red)}

/* ─── SVG CHART ─── */
.chart-container{width:100%;position:relative}
.chart-container svg{display:block;width:100%}

/* ─── QUEUE BIG NUMBER ─── */
.q-big{font-family:var(--font-mono);font-size:2.2rem;font-weight:700;line-height:1}
.q-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.q-item{font-size:.7rem;color:var(--text-secondary)}
.q-item span{font-family:var(--font-mono);font-weight:600}

/* ─── INDICATOR DOT ─── */
.idot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:6px;flex-shrink:0}

/* ─── ERROR TEXT ─── */
.err-text{color:var(--red);font-size:.7rem;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ─── LOADING STATE ─── */
.loading-shimmer{
  background:linear-gradient(90deg,var(--card) 25%,#1a1a1d 50%,var(--card) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.loading-block{height:16px;margin:6px 0}

/* ─── SCROLL ─── */
.scroll-x{overflow-x:auto}
.scroll-x::-webkit-scrollbar{height:4px}
.scroll-x::-webkit-scrollbar-track{background:transparent}
.scroll-x::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<!-- ═══ TOP NAV ═══ -->
<nav class="topnav">
  <div class="topnav-brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>PMDB<small> Meridian</small></span>
  </div>
  <div class="topnav-links">
    <a href="/">V1</a>
    <a href="/v2" class="active">V2</a>
    <a href="/v3">V3</a>
  </div>
  <div class="topnav-right">
    <div class="topnav-status">
      <span class="dot"></span>
      <span id="nav-last-update">Connecting…</span>
    </div>
  </div>
</nav>

<!-- ═══ TAB BAR ═══ -->
<div class="tab-bar">
  <button class="tab-btn active" data-tab="overview">Overview</button>
  <button class="tab-btn" data-tab="queue">Queue</button>
  <button class="tab-btn" data-tab="providers">Providers</button>
  <button class="tab-btn" data-tab="activity">Activity</button>
</div>

<!-- ═══ MAIN ═══ -->
<div class="main">

  <!-- ── TAB: OVERVIEW ── -->
  <div class="tab-panel active" id="tab-overview">
    <div class="stats-grid" id="stats-grid">
      <!-- filled by JS -->
    </div>

    <div class="panel">
      <div class="panel-header">
        <span class="panel-title">Submission Trend</span>
        <span class="panel-badge" id="trend-total"></span>
      </div>
      <div class="panel-body chart-container" id="trend-chart" style="padding:8px 0 0">
        <!-- SVG injected -->
      </div>
    </div>

    <div class="two-col">
      <div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Titles by Type</span></div>
          <div class="panel-body" id="titles-bars"></div>
        </div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Mappings by Type</span></div>
          <div class="panel-body"><div class="scroll-x"><table class="data-table" id="mappings-table"><thead><tr><th>Type</th><th class="r">Total</th><th class="r">Submitted</th><th class="r">Pending</th><th class="r">Failed</th></tr></thead><tbody></tbody></table></div></div>
        </div>
      </div>
      <div>
        <div class="panel">
          <div class="panel-header"><span class="panel-title">Ratings by Source</span></div>
          <div class="panel-body"><div class="scroll-x"><table class="data-table" id="ratings-table"><thead><tr><th>Source</th><th class="r">Count</th><th class="r">Avg</th><th class="r">Submitted</th><th class="r">Pending</th><th class="r">Failed</th></tr></thead><tbody></tbody></table></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ── TAB: QUEUE ── -->
  <div class="tab-panel" id="tab-queue">
    <div class="three-col" id="queue-cards"></div>
    <div class="panel">
      <div class="panel-header"><span class="panel-title">Queue Summary</span></div>
      <div class="panel-body"><div class="scroll-x"><table class="data-table" id="queue-table"><thead><tr><th>Category</th><th class="r">Pending</th><th class="r">In-Flight</th><th class="r">Failed</th></tr></thead><tbody></tbody></table></div></div>
    </div>
  </div>

  <!-- ── TAB: PROVIDERS ── -->
  <div class="tab-panel" id="tab-providers">
    <div class="three-col" id="provider-cards"></div>
  </div>

  <!-- ── TAB: ACTIVITY ── -->
  <div class="tab-panel" id="tab-activity">
    <div class="panel">
      <div class="panel-header"><span class="panel-title">Recent Titles</span><span class="panel-badge" id="recent-count"></span></div>
      <div class="panel-body"><div class="scroll-x"><table class="data-table" id="recent-table"><thead><tr><th>Title</th><th>Type</th><th class="r">Vote</th><th>Ratings</th><th>Enriched</th><th>Error</th></tr></thead><tbody></tbody></table></div></div>
    </div>
    <div class="panel">
      <div class="panel-header"><span class="panel-title">Daily Submitted Titles</span></div>
      <div class="panel-body chart-container" id="daily-titles-chart" style="padding:8px 0 0"></div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════
   MERIDIAN — PMDB Control Panel
   ═══════════════════════════════════════════ */

// ─── Helpers ───
const fmt = n => n == null ? '—' : Number(n).toLocaleString();
const fmtDec = (n,d=1) => n == null ? '—' : Number(n).toFixed(d);
const esc = s => {const d=document.createElement('div');d.textContent=s;return d.innerHTML};

function relTime(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  if (isNaN(d)) return '—';
  const s = Math.floor((Date.now()-d)/1000);
  if (s < 5) return 'just now';
  if (s < 60) return s+'s ago';
  if (s < 3600) return Math.floor(s/60)+'m ago';
  if (s < 86400) return Math.floor(s/3600)+'h ago';
  return Math.floor(s/86400)+'d ago';
}

function sparkSVG(data, w=60, h=24, color='#10b981') {
  if (!data||data.length<2) return '';
  const max = Math.max(...data,1);
  const pts = data.map((v,i)=>{
    const x = (i/(data.length-1))*w;
    const y = h - (v/max)*(h-2) -1;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return `<svg class="sparkline" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

const labelColors = {IM:'#f59e0b',RT:'#ef4444',MC:'#8b5cf6',TM:'#3b82f6',PC:'#10b981',LB:'#f97316',TR:'#ec4899',ML:'#06b6d4',RE:'#84cc16'};
function labelColor(l){return labelColors[l]||'#71717a'}

// ─── Tabs ───
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
  });
});

// ─── State ───
let state = {};

async function fetchJSON(url) {
  try { const r = await fetch(url); if(!r.ok) throw 0; return await r.json(); }
  catch(e){ return null; }
}

async function loadAll() {
  const [stats,services,titlesSummary,ratingsSummary,mappingsSummary,episodesSummary,metricsHistory,titlesRecent,titlesDaily] = await Promise.all([
    fetchJSON('/api/stats'),
    fetchJSON('/api/services'),
    fetchJSON('/api/titles/summary'),
    fetchJSON('/api/ratings/summary'),
    fetchJSON('/api/mappings/summary'),
    fetchJSON('/api/episodes/summary'),
    fetchJSON('/api/metrics/history'),
    fetchJSON('/api/titles/recent'),
    fetchJSON('/api/titles/daily'),
  ]);
  state = {stats,services,titlesSummary,ratingsSummary,mappingsSummary,episodesSummary,metricsHistory,titlesRecent,titlesDaily};
  render();
  document.getElementById('nav-last-update').textContent = 'Updated '+new Date().toLocaleTimeString();
}

// ─── Render ───
function render() {
  renderStats();
  renderTrend();
  renderTitlesBars();
  renderMappingsTable();
  renderRatingsTable();
  renderQueueCards();
  renderQueueTable();
  renderProviders();
  renderRecent();
  renderDailyTitles();
}

// ── Stats Hero Row ──
function renderStats() {
  const s = state.stats?.summary || {};
  const q = state.stats?.queue || {};
  const daily = state.metricsHistory?.daily || [];
  const last7r = daily.slice(-7).map(d=>d.ratings||0);
  const last7m = daily.slice(-7).map(d=>d.mappings||0);
  const last7e = daily.slice(-7).map(d=>d.episode_ratings||0);
  const last7all = daily.slice(-7).map(d=>(d.ratings||0)+(d.mappings||0)+(d.episode_ratings||0));

  const pendingTotal = (q.ratings_pending||0)+(q.episode_ratings_pending||0)+(q.mappings_pending||0);
  const failedTotal = (q.ratings_failed||0)+(q.episode_ratings_failed||0)+(q.mappings_failed||0);

  const cards = [
    {label:'Total Titles',value:fmt(s.titles_total),sub:'enriched library',spark:sparkSVG(last7all,60,24,'#3b82f6'),cls:''},
    {label:'Ratings Today',value:fmt(s.ratings_today),sub:`of ${fmt(s.ratings_total)} total`,spark:sparkSVG(last7r,60,24,'#10b981'),cls:''},
    {label:'Mappings Today',value:fmt(s.mappings_today),sub:`of ${fmt(s.mappings_total)} total`,spark:sparkSVG(last7m,60,24,'#8b5cf6'),cls:''},
    {label:'Episodes Today',value:fmt(s.episode_ratings_today),sub:`of ${fmt(s.episode_ratings_total)} total`,spark:sparkSVG(last7e,60,24,'#f59e0b'),cls:''},
    {label:'Queue Pending',value:fmt(pendingTotal),sub:'awaiting submission',spark:'',cls:'pending'},
    {label:'Queue Failed',value:fmt(failedTotal),sub:'need attention',spark:'',cls:'failed'},
  ];

  document.getElementById('stats-grid').innerHTML = cards.map(c=>`
    <div class="stat-card ${c.cls}">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value">${c.value}</div>
      <div class="stat-sub">${c.sub}</div>
      ${c.spark}
    </div>
  `).join('');
}

// ── Trend Chart ──
function renderTrend() {
  const daily = state.metricsHistory?.daily || [];
  const totals = state.metricsHistory?.totals;
  if (totals) {
    document.getElementById('trend-total').textContent = `${fmt(totals.ratings)} ratings · ${fmt(totals.mappings)} mappings · ${fmt(totals.episode_ratings)} episodes`;
  }
  if (daily.length < 2) {
    document.getElementById('trend-chart').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:.8rem">No trend data available</div>';
    return;
  }
  const W = 800, H = 200, PAD_L = 48, PAD_R = 16, PAD_T = 12, PAD_B = 32;
  const cw = W - PAD_L - PAD_R, ch = H - PAD_T - PAD_B;
  const n = daily.length;

  // stacked: episodes on bottom, then mappings, then ratings on top
  const maxStack = Math.max(...daily.map(d=>(d.ratings||0)+(d.mappings||0)+(d.episode_ratings||0)),1);

  function xPos(i){return PAD_L + (i/(n-1))*cw}
  function yPos(v){return PAD_T + ch - (v/maxStack)*ch}

  // build area paths for stacked layers
  function areaPath(vals){
    let top = vals.map((v,i)=>`${i===0?'M':'L'}${xPos(i).toFixed(1)},${yPos(v).toFixed(1)}`).join(' ');
    let bot = '';
    for(let i=n-1;i>=0;i--) bot += `L${xPos(i).toFixed(1)},${yPos(0).toFixed(1)} `;
    return top + ' ' + bot + 'Z';
  }

  const s1 = daily.map(d=>d.episode_ratings||0);
  const s2 = daily.map((d,i)=>s1[i]+(d.mappings||0));
  const s3 = daily.map((d,i)=>s2[i]+(d.ratings||0));

  function stackArea(bottom,top,color){
    let path = top.map((v,i)=>`${i===0?'M':'L'}${xPos(i).toFixed(1)},${yPos(v).toFixed(1)}`).join(' ');
    for(let i=n-1;i>=0;i--) path += ` L${xPos(i).toFixed(1)},${yPos(bottom[i]).toFixed(1)}`;
    path += ' Z';
    return `<path d="${path}" fill="${color}" opacity=".35"/>
            <polyline points="${top.map((v,i)=>`${xPos(i).toFixed(1)},${yPos(v).toFixed(1)}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.5"/>`;
  }

  // grid lines
  const gridLines = 5;
  let grid = '';
  for(let i=0;i<=gridLines;i++){
    const y = PAD_T + (i/gridLines)*ch;
    const val = Math.round(maxStack * (1 - i/gridLines));
    grid += `<line x1="${PAD_L}" y1="${y}" x2="${W-PAD_R}" y2="${y}" stroke="rgba(255,255,255,.04)" stroke-width="1"/>`;
    grid += `<text x="${PAD_L-6}" y="${y+3}" text-anchor="end" fill="#3f3f46" font-size="9" font-family="'JetBrains Mono',monospace">${fmt(val)}</text>`;
  }

  // x labels (show ~6)
  let xLabels = '';
  const step = Math.max(1,Math.floor(n/6));
  for(let i=0;i<n;i+=step){
    const d = daily[i].date||'';
    const short = d.slice(5); // MM-DD
    xLabels += `<text x="${xPos(i)}" y="${H-4}" text-anchor="middle" fill="#3f3f46" font-size="9" font-family="'JetBrains Mono',monospace">${short}</text>`;
  }

  // legend
  const legend = `
    <g transform="translate(${PAD_L},${H - 2})">
      <rect x="0" y="-4" width="8" height="4" rx="1" fill="#10b981"/>
      <text x="12" y="0" fill="#71717a" font-size="8" font-family="var(--font-body)">Ratings</text>
      <rect x="60" y="-4" width="8" height="4" rx="1" fill="#8b5cf6"/>
      <text x="72" y="0" fill="#71717a" font-size="8" font-family="var(--font-body)">Mappings</text>
      <rect x="130" y="-4" width="8" height="4" rx="1" fill="#f59e0b"/>
      <text x="142" y="0" fill="#71717a" font-size="8" font-family="var(--font-body)">Episodes</text>
    </g>`;

  const zeros = new Array(n).fill(0);
  const svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${grid}${xLabels}
    ${stackArea(zeros, s1, '#f59e0b')}
    ${stackArea(s1, s2, '#8b5cf6')}
    ${stackArea(s2, s3, '#10b981')}
    ${legend}
  </svg>`;
  document.getElementById('trend-chart').innerHTML = svg;
}

// ── Titles by Type bars ──
function renderTitlesBars() {
  const byType = state.titlesSummary?.by_type || [];
  const max = Math.max(...byType.map(t=>t.total||0),1);
  const colors = {movie:'#3b82f6',tv:'#8b5cf6',person:'#f59e0b'};
  document.getElementById('titles-bars').innerHTML = byType.length === 0
    ? '<div style="color:var(--text-muted);font-size:.8rem">No data</div>'
    : byType.map(t=>{
    const pct = ((t.total||0)/max*100);
    const c = colors[t.media_type]||'#71717a';
    return `<div class="hbar-row">
      <span class="hbar-label">${esc(t.media_type||'?')}</span>
      <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(pct,2)}%;background:${c}">${fmt(t.total)}</div></div>
      <span class="hbar-count" style="color:var(--text-secondary)">${fmt(t.enriched||0)} enr</span>
    </div>`;
  }).join('');
}

// ── Queue Cards ──
function renderQueueCards() {
  const q = state.stats?.queue || {};
  const rStatus = state.ratingsSummary?.by_status || [];
  const mStatus = state.mappingsSummary?.by_status || [];
  const eStatus = state.episodesSummary?.by_status || [];

  function statusMap(arr){
    const m={};(arr||[]).forEach(s=>{m[(s.pmdb_status||'').toLowerCase()]=s.total||0});return m;
  }

  const queues = [
    {name:'Ratings',pending:q.ratings_pending||0,inflight:q.ratings_in_flight||0,failed:q.ratings_failed||0,statuses:statusMap(rStatus),color:'var(--emerald)'},
    {name:'Mappings',pending:q.mappings_pending||0,inflight:q.mappings_in_flight||0,failed:q.mappings_failed||0,statuses:statusMap(mStatus),color:'var(--violet)'},
    {name:'Episodes',pending:q.episode_ratings_pending||0,inflight:q.episode_ratings_in_flight||0,failed:q.episode_ratings_failed||0,statuses:statusMap(eStatus),color:'var(--amber)'},
  ];

  document.getElementById('queue-cards').innerHTML = queues.map(qc=>{
    const total = Math.max(qc.pending+qc.inflight+qc.failed,1);
    const pPct=(qc.pending/total*100).toFixed(1);
    const iPct=(qc.inflight/total*100).toFixed(1);
    const fPct=(qc.failed/total*100).toFixed(1);
    const submitted = qc.statuses['submitted']||0;
    return `<div class="panel">
      <div class="panel-header"><span class="panel-title">${qc.name} Queue</span></div>
      <div class="panel-body">
        <div class="q-big" style="color:${qc.color}">${fmt(qc.pending)}</div>
        <div style="font-size:.7rem;color:var(--text-secondary);margin-top:2px">pending</div>
        <div class="stacked-bar">
          <span class="seg-pending" style="width:${pPct}%"></span>
          <span class="seg-inflight" style="width:${iPct}%"></span>
          <span class="seg-failed" style="width:${fPct}%"></span>
        </div>
        <div class="q-row">
          <div class="q-item"><span class="pill pill-inflight">${fmt(qc.inflight)}</span> in-flight</div>
          <div class="q-item"><span class="pill pill-failed">${fmt(qc.failed)}</span> failed</div>
          <div class="q-item"><span class="pill pill-submitted">${fmt(submitted)}</span> submitted</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Providers ──
function renderProviders() {
  const svcs = state.services?.services || [];
  document.getElementById('provider-cards').innerHTML = svcs.length===0
    ? '<div class="panel"><div class="panel-body" style="color:var(--text-muted)">No provider data</div></div>'
    : svcs.map(s=>{
    const active = !s.is_paused;
    const dotColor = active?'var(--emerald)':'var(--red)';
    const limitPct = s.rate_limit ? Math.max(0,Math.min(100,((s.rate_remaining||0)/(s.rate_limit||1))*100)) : null;
    const statusColor = !s.last_status ? 'var(--text-muted)' : s.last_status>=200&&s.last_status<300?'var(--emerald)':s.last_status>=400?'var(--red)':'var(--amber)';
    return `<div class="panel">
      <div class="provider-card">
        <div class="provider-header">
          <span class="provider-name"><span class="dot" style="background:${dotColor}"></span>${esc(s.service||'')}</span>
          <span class="pill ${active?'pill-active':'pill-paused'}">${active?'ACTIVE':'PAUSED'}</span>
        </div>
        ${s.is_paused?`<div style="font-size:.7rem;color:var(--amber);margin-bottom:6px">
          ${s.pause_reason?esc(s.pause_reason):''} ${s.pause_remaining_seconds?`· ${Math.ceil(s.pause_remaining_seconds)}s remaining`:''}
        </div>`:''}
        ${limitPct!==null?`
        <div style="display:flex;justify-content:space-between;font-size:.65rem;color:var(--text-secondary);margin-top:4px">
          <span>Rate Limit</span><span style="font-family:var(--font-mono)">${fmt(s.rate_remaining)} / ${fmt(s.rate_limit)}</span>
        </div>
        <div class="rate-bar-track"><div class="rate-bar-fill" style="width:${limitPct}%;${limitPct<20?'background:var(--red)':limitPct<50?'background:var(--amber)':''}"></div></div>
        `:''}
        <div class="provider-meta">
          <div class="meta-item"><label>HTTP Status</label><span style="color:${statusColor}">${s.last_status||'—'}</span></div>
          <div class="meta-item"><label>Updated</label><span>${relTime(s.updated_at)}</span></div>
          ${s.rate_reset?`<div class="meta-item"><label>Rate Reset</label><span>${relTime(s.rate_reset)}</span></div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── Recent Titles ──
function renderRecent() {
  const titles = state.titlesRecent?.titles || [];
  document.getElementById('recent-count').textContent = titles.length+' titles';
  const tb = document.querySelector('#recent-table tbody');
  tb.innerHTML = titles.length===0
    ? '<tr><td colspan="6" style="color:var(--text-muted)">No recent activity</td></tr>'
    : titles.map(t=>{
    const ratingDots = (t.ratings||[]).map(r=>{
      const st = (r.pmdb_status||'').toLowerCase();
      const cls = st==='submitted'?'submitted':st==='pending'?'pending':'failed';
      return `<span class="rating-dot ${cls}" title="${esc(r.label)}: ${r.score!=null?r.score:'?'} (${st})">${esc(r.label||'')}</span>`;
    }).join('');
    const typeClass = (t.media_type||'').toLowerCase()==='movie'?'pill-movie':'pill-tv';
    return `<tr>
      <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.title||'')}">${esc(t.title||'—')}</td>
      <td><span class="pill ${typeClass}">${esc((t.media_type||'?').toUpperCase())}</span></td>
      <td class="mono">${t.tmdb_vote_average!=null?fmtDec(t.tmdb_vote_average):'—'}</td>
      <td><div class="rating-dots">${ratingDots||'—'}</div></td>
      <td style="font-size:.75rem;color:var(--text-secondary)">${relTime(t.last_harvested_at)}</td>
      <td>${t.last_error?`<span class="err-text" title="${esc(t.last_error)}">${esc(t.last_error)}</span>`:''}</td>
    </tr>`;
  }).join('');
}

// ── Daily Titles Bar Chart ──
function renderDailyTitles() {
  const days = state.titlesDaily?.daily_titles || [];
  if(days.length===0){
    document.getElementById('daily-titles-chart').innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:.8rem">No data</div>';
    return;
  }
  const W=800,H=160,PAD_L=48,PAD_R=16,PAD_T=8,PAD_B=28;
  const cw=W-PAD_L-PAD_R,ch=H-PAD_T-PAD_B;
  const n=days.length;
  const max=Math.max(...days.map(d=>d.title_count||0),1);
  const bw=Math.max(2,Math.min(20,cw/n-2));

  let bars='',labels='';
  days.forEach((d,i)=>{
    const x=PAD_L+(i/n)*cw+(cw/n-bw)/2;
    const h=((d.title_count||0)/max)*ch;
    const y=PAD_T+ch-h;
    bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="2" fill="#3b82f6" opacity=".7">
      <title>${d.day_key}: ${d.title_count}</title></rect>`;
    if(i%Math.max(1,Math.floor(n/8))===0){
      labels+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-4}" text-anchor="middle" fill="#3f3f46" font-size="8" font-family="'JetBrains Mono',monospace">${(d.day_key||'').slice(5)}</text>`;
    }
  });

  // grid
  let grid='';
  for(let i=0;i<=4;i++){
    const y=PAD_T+(i/4)*ch;
    const val=Math.round(max*(1-i/4));
    grid+=`<line x1="${PAD_L}" y1="${y}" x2="${W-PAD_R}" y2="${y}" stroke="rgba(255,255,255,.04)"/>`;
    grid+=`<text x="${PAD_L-6}" y="${y+3}" text-anchor="end" fill="#3f3f46" font-size="9" font-family="'JetBrains Mono',monospace">${fmt(val)}</text>`;
  }

  document.getElementById('daily-titles-chart').innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}${bars}${labels}</svg>`;
}
